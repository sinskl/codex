name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,rust-src
          rustup target add aarch64-linux-android --toolchain 1.95.0
          rustup default 1.95.0
          rustc -vV

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ninja-build python3-setuptools
          protoc --version
          ninja --version

      - name: Pre-download V8 android NDK and patch GN config
        run: |
          # Let cargo fetch/unpack the v8 crate first, then patch it.
          cd codex-rs
          cargo fetch
          V8_DIR=$(ls -d ~/.cargo/registry/src/*/v8-150.4.0)
          cd "$V8_DIR"
          # Download the NDK the build.rs expects at third_party/android_ndk.
          mkdir -p third_party
          curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q ndk.zip -d third_party/
          mv third_party/android-ndk-r26c third_party/android_ndk
          rm ndk.zip
          # GN looks for the NDK at third_party/android_toolchain/ndk.
          mkdir -p third_party/android_toolchain
          ln -sfn ../android_ndk third_party/android_toolchain/ndk
          # Declare the missing android_ndk_version variable.
          python3 - <<'EOF'
          import re
          p = 'build/config/android/config.gni'
          s = open(p).read()
          if 'android_ndk_version' not in s:
              s = s.replace(
                  'declare_args() {\n  # Build incremental targets whenever possible.',
                  'declare_args() {\n  # NDK version used by the vendored (non-Chromium) build.\n  android_ndk_version = "26.3.11579264"\n\n  # Build incremental targets whenever possible.',
                  1)
              open(p, 'w').write(s)
          print('patched', p)
          EOF
          # Stub out .pydeps files (normally generated by gclient sync) that GN
          # reads while parsing the chromium build scripts. pydeps_file paths
          # are relative to the BUILD.gn that references them.
          python3 - <<'EOF'
          import os, re
          stubs = 0
          for root, dirs, files in os.walk('.'):
              for fn in files:
                  if not fn.endswith('.gn') and not fn.endswith('.gni'):
                      continue
                  p = os.path.join(root, fn)
                  try:
                      text = open(p, encoding='utf-8', errors='ignore').read()
                  except OSError:
                      continue
                  for m in re.finditer(r'pydeps_file\s*=\s*"([^"]+\.pydeps)"', text):
                      dep = m.group(1)
                      if dep.startswith('//') or dep.startswith('/'):
                          dep = dep[2:] if dep.startswith('//') else dep.lstrip('/')
                          target = dep
                      else:
                          target = os.path.normpath(os.path.join(root, dep))
                      if not os.path.isfile(target):
                          os.makedirs(os.path.dirname(target), exist_ok=True)
                          with open(target, 'w') as f:
                              f.write('')
                          stubs += 1
                          print('stubbed', target)
          print('total stubs:', stubs)
          EOF
          # GN sets use_sysroot=true globally for the android cross build, which
          # also applies to host toolchains (x64 linux). Install the debian amd64
          # sysroot they require.
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64

      - name: Cargo build
        working-directory: codex-rs
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_BUILD_TARGET: aarch64-linux-android
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          PROTOC: /usr/bin/protoc
          RUSTFLAGS: -C link-arg=-Wl,-rpath,/data/data/com.termux/files/usr/lib
          V8_FROM_SOURCE: "1"
        run: cargo build -p codex-cli -p codex-code-mode-host --release

      - name: Package binary
        run: |
          cd codex-rs/target/aarch64-linux-android/release
          ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip codex codex-code-mode-host
          mkdir -p codex-android
          cp codex codex-android/
          cp codex-code-mode-host codex-android/
          echo '{"version":"0.153.4"}' > codex-android/codex-package.json
          tar -czf ../../../codex-android.tar.gz codex-android
          ls -lh ../../../codex-android.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-aarch64
          path: codex-rs/codex-android.tar.gz
